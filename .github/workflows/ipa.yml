# Builds SwingLab for sideloading and attaches it to a release:
#   SwingLab-<v>-ios-unsigned.ipa        unsigned device build (AltStore, SideStore,
#                                        Sideloadly or Xcode sign it with your Apple ID)
#   SwingLab-<v>-ios-simulator-arm64.zip  the app for the iOS Simulator on Apple-silicon Macs
#   altstore-source.json                  AltStore/SideStore source: add
#     https://github.com/jongsu-king/SwingLab/releases/latest/download/altstore-source.json
#     once and new releases show up as updates automatically
#   SHA256SUMS.txt
# Runs for a v* tag, or by hand for an existing tag ("Run workflow").
name: iOS builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (empty: latest release)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName -q .tagName); fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git checkout -q "$TAG"
          git checkout -q "$GITHUB_SHA" -- Scripts/altstore_source.py
      - name: Newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build (device, unsigned)
        run: |
          xcodebuild -project SwingLab.xcodeproj -scheme SwingLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
      - name: Build (simulator)
        run: |
          xcodebuild -project SwingLab.xcodeproj -scheme SwingLab -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd-sim \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Package
        run: |
          APP=dd-device/Build/Products/Release-iphoneos/SwingLab.app
          V=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          if [ "v$V" != "$TAG" ]; then echo "app version $V does not match tag $TAG"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p out ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../out/SwingLab-$V-ios-unsigned.ipa" Payload)
          (cd dd-sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/out/SwingLab-$V-ios-simulator-arm64.zip" SwingLab.app)
          python3 Scripts/altstore_source.py --ipa "out/SwingLab-$V-ios-unsigned.ipa" --version "$V" \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" --out out/altstore-source.json
          (cd out && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: ios-builds
          path: out/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" out/* --clobber
          python3 - <<'PY'
          import os, pathlib, subprocess
          tag, repo, v = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"], os.environ["VERSION"]
          body = subprocess.run(["gh", "release", "view", tag, "--json", "body", "-q", ".body"],
                                capture_output=True, text=True, check=True).stdout
          body = body.split("\n## iPhone downloads")[0].rstrip()
          sums = dict(reversed(l.split()) for l in pathlib.Path("out/SHA256SUMS.txt").read_text().splitlines())
          base = f"https://github.com/{repo}/releases/download/{tag}"
          desc = {f"SwingLab-{v}-ios-unsigned.ipa": "iPhone, iOS 17+ - unsigned; sign while installing (see below)",
                  f"SwingLab-{v}-ios-simulator-arm64.zip": "iOS Simulator on an Apple-silicon Mac (`xcrun simctl install booted SwingLab.app`)",
                  "altstore-source.json": "AltStore / SideStore source for automatic updates"}
          rows = [f"| [`{n}`]({base}/{n}) | {d} | `{sums[n]}` |" for n, d in desc.items()]
          text = "\n".join([body, "", "## iPhone downloads", "",
            "| File | For | SHA-256 |", "|---|---|---|", *rows, "",
            "**Install on an iPhone.** The IPA is not signed: Apple only runs apps signed for your device. "
            "Use [AltStore](https://altstore.io) or [SideStore](https://sidestore.io) (free Apple ID; the "
            "signature lasts 7 days and the app refreshes it), [Sideloadly](https://sideloadly.io), or build "
            "from source in Xcode with your own team.",
            "",
            "**Automatic updates.** In AltStore or SideStore, add this source once: "
            f"`https://github.com/{repo}/releases/latest/download/altstore-source.json` - "
            "every new release then appears as an update in the app's *My Apps* list. "
            "(An App Store or TestFlight build would update itself; that needs an Apple Developer account.)"])
          pathlib.Path("notes.md").write_text(text + "\n")
          PY
          gh release edit "$TAG" --notes-file notes.md
